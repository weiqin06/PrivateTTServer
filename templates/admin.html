{% extends 'base.html' %}
{% block content %}
<h2>Admin Panel</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Rating</th>
            <th>Change Password</th>
            <th>Dangerous</th>
        </tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.role }}</td>
            <form action="/admin/update_user/{{ u.id }}" method="post">
                <td>
                    <input type="number" name="rating" value="{{ u.rating }}" style="width: 70px;">
                    <button type="submit" style="background-color: #f0ad4e; color: white; border: none; cursor: pointer;">Save</button>
                </td>
                <td>
                    <input type="text" name="password" placeholder="new password" style="width: 120px;">
                    <button type="submit" style="background-color: #f0ad4e; color: white; border: none; cursor: pointer;">Save</button>
                </td>
            </form>
            <td>
                {% if u.id != session['user_id'] %}
                <form action="/admin/delete_user/{{ u.id }}" method="post" onsubmit="return confirm('Are you sure you want to delete this user and all record？');" style="display:inline;">
                    <button type="submit" style="background-color: #d9534f; color: white; border: none; cursor: pointer;">Delete</button>
                </form>
                {% else %}
                <span style="color: gray;">(current)</span>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<style>
    input { padding: 4px; margin: 2px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 5px 10px; border-radius: 4px; }
</style>
{% endblock %}
