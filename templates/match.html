
{% extends 'base.html' %}
{% block content %}
<h2>Record Game Results</h2>
<div style="background: #f9f9f9; padding: 20px; border-radius: 8px;">
    <form method="post">
        <div style="margin-bottom: 15px;">
            <label><strong>Opponent:</strong></label><br>
            <select name="opponent_id" required style="width: 200px;">
                <option value="">-- Select Opponent --</option>
                {% for op in opponents %}
                <option value="{{ op.id }}">{{ op.username }} (Rating: {{ op.rating }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label><strong>Score (Me : Opponent):</strong></label><br>
            <input type="number" name="my_score" placeholder="Me" min="0" required style="width: 60px;">
            :
            <input type="number" name="op_score" placeholder="Op" min="0" required style="width: 60px;">
        </div>

        <button type="submit" style="background: #4CAF50; color: white; border: none; cursor: pointer;">Submit</button>
    </form>
</div>
{% endblock %}
